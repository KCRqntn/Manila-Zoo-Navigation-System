<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Hyena</title>
  <!-- Round ears with dark insides -->
  <circle cx="15" cy="17" r="9.5" fill="#c49a62"/>
  <circle cx="49" cy="17" r="9.5" fill="#c49a62"/>
  <circle cx="15" cy="17" r="5.2" fill="#5a4330"/>
  <circle cx="49" cy="17" r="5.2" fill="#5a4330"/>
  <!-- Head with the spotted hyena's spots -->
  <ellipse cx="32" cy="34" rx="20" ry="19" fill="#dcb47c"/>
  <path d="M26 15 l2 -4 l2 4 l2 -4 l2 4 l2 -4 l2 4" fill="none" stroke="#5a4330" stroke-width="2.2" stroke-linejoin="round"/>
  <ellipse cx="22" cy="22" rx="2.4" ry="2" fill="#6b4f33"/>
  <ellipse cx="42" cy="22" rx="2.4" ry="2" fill="#6b4f33"/>
  <ellipse cx="32" cy="21" rx="2" ry="1.7" fill="#6b4f33"/>
  <ellipse cx="17" cy="36" rx="2.2" ry="2" fill="#6b4f33"/>
  <ellipse cx="47" cy="36" rx="2.2" ry="2" fill="#6b4f33"/>
  <ellipse cx="20" cy="44" rx="1.8" ry="1.6" fill="#6b4f33"/>
  <ellipse cx="44" cy="44" rx="1.8" ry="1.6" fill="#6b4f33"/>
  <!-- Eyes -->
  <circle cx="24.5" cy="31" r="2.8" fill="#1d1a17"/>
  <circle cx="39.5" cy="31" r="2.8" fill="#1d1a17"/>
  <circle cx="25.4" cy="30" r="0.9" fill="#fff"/>
  <circle cx="40.4" cy="30" r="0.9" fill="#fff"/>
  <!-- Dark muzzle, nose and a little grin -->
  <ellipse cx="32" cy="44" rx="10.5" ry="8.5" fill="#43332a"/>
  <ellipse cx="32" cy="39.5" rx="4.2" ry="2.8" fill="#111"/>
  <path d="M27 46 q5 4 10 0" fill="none" stroke="#e9d6bd" stroke-width="1.6" stroke-linecap="round"/>
</svg>
