# Whole system on one server: website + HTTPS (Caddy), API, and the AI model.
# On the server, from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production up -d --build
# See deploy/HOSTING.md for the full steps.
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data   # keeps the HTTPS certificate across restarts
    depends_on: [api]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    env_file: .env.production
    environment:
      AI_SERVICE_URL: http://ai:8000
      PORT: "5000"
      TZ: Asia/Manila
      # Encrypted backups live in a private volume, never in the website's files
      BACKUP_DIR: /backups
    volumes:
      - zoo_backups:/backups
    depends_on: [ai]
    restart: unless-stopped

  ai:
    build:
      context: ../ai-training
      dockerfile: ../deploy/Dockerfile.ai
    restart: unless-stopped

volumes:
  caddy_data:
  zoo_backups:   # encrypted backup files (copy them off the server regularly)
