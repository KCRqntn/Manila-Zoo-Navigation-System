      properties:
        name: { type: string, minLength: 1 }
        scientific_name: { type: ["string", "null"] }
        common_name: { type: ["string", "null"] }
        category_id: { type: ["integer", "null"] }
        kingdom: { type: ["string", "null"] }
        phylum: { type: ["string", "null"] }
        class: { type: ["string", "null"] }
        order: { type: ["string", "null"] }
        family: { type: ["string", "null"] }
        genus: { type: ["string", "null"] }
        species: { type: ["string", "null"] }
        habitat: { type: ["string", "null"] }
        diet: { type: ["string", "null"] }
        weight_kg: { type: ["number", "null"] }
        height_cm: { type: ["number", "null"] }
        lifespan_years: { type: ["integer", "null"] }
        conservation_status: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        interesting_facts: { type: ["string", "null"] }
        feeding_schedule: { type: ["string", "null"] }
        image_url: { type: ["string", "null"] }
        location_id: { type: ["integer", "null"] }
        is_featured: { type: ["boolean", "null"] }

    AnimalUpdate:
      type: object
      properties:
        name: { type: ["string", "null"] }
        scientific_name: { type: ["string", "null"] }
        common_name: { type: ["string", "null"] }
        category_id: { type: ["integer", "null"] }
        kingdom: { type: ["string", "null"] }
        phylum: { type: ["string", "null"] }
        class: { type: ["string", "null"] }
        order: { type: ["string", "null"] }
        family: { type: ["string", "null"] }
        genus: { type: ["string", "null"] }
        species: { type: ["string", "null"] }
        habitat: { type: ["string", "null"] }
        diet: { type: ["string", "null"] }
        weight_kg: { type: ["number", "null"] }
        height_cm: { type: ["number", "null"] }
        lifespan_years: { type: ["integer", "null"] }
        conservation_status: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        interesting_facts: { type: ["string", "null"] }
        feeding_schedule: { type: ["string", "null"] }
        image_url: { type: ["string", "null"] }
        location_id: { type: ["integer", "null"] }
        is_featured: { type: ["boolean", "null"] }

    AnimalGalleryItem:
      type: object
      required: [id, animal_id, image_url, created_at]
      properties:
        id: { type: integer }
        animal_id: { type: integer }
        image_url: { type: string }
        caption: { type: ["string", "null"] }
        sort_order: { type: integer }
        created_at: { type: string }

    AnimalGalleryInput:
      type: object
      required: [image_url]
      properties:
        image_url: { type: string }
        caption: { type: ["string", "null"] }
        sort_order: { type: ["integer", "null"] }

    # ── Category ──────────────────────────────────────────────────────────────
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        icon: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        animal_count: { type: integer }

    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        icon: { type: ["string", "null"] }
        color: { type: ["string", "null"] }

    CategoryUpdate:
      type: object
      properties:
        name: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        icon: { type: ["string", "null"] }
        color: { type: ["string", "null"] }

    # ── Map ────────────────────────────────────────────────────────────────────
    MapPin:
      type: object
      required: [id, name, pin_type, lat, lng, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        pin_type: { type: string }
        lat: { type: number }
        lng: { type: number }
        animal_id: { type: ["integer", "null"] }
        animal_name: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        icon: { type: ["string", "null"] }
        is_active: { type: boolean }
        created_at: { type: string }
        updated_at: { type: ["string", "null"] }

    MapPinInput:
      type: object
      required: [name, pin_type, lat, lng]
      properties:
        name: { type: string, minLength: 1 }
        pin_type: { type: string }
        lat: { type: number }
        lng: { type: number }
        animal_id: { type: ["integer", "null"] }
        description: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        icon: { type: ["string", "null"] }

    MapPinUpdate:
      type: object
      properties:
        name: { type: ["string", "null"] }
        pin_type: { type: ["string", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        animal_id: { type: ["integer", "null"] }
        description: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        icon: { type: ["string", "null"] }
        is_active: { type: ["boolean", "null"] }

    MapConfig:
      type: object
      required: [id, map_image_url, center_lat, center_lng, default_zoom]
      properties:
        id: { type: integer }
        map_image_url: { type: string }
        center_lat: { type: number }
        center_lng: { type: number }
        default_zoom: { type: integer }
        sw_lat: { type: ["number", "null"] }
        sw_lng: { type: ["number", "null"] }
        ne_lat: { type: ["number", "null"] }
        ne_lng: { type: ["number", "null"] }
        updated_at: { type: ["string", "null"] }

    MapConfigUpdate:
      type: object
      properties:
        map_image_url: { type: ["string", "null"] }
        center_lat: { type: ["number", "null"] }
        center_lng: { type: ["number", "null"] }
        default_zoom: { type: ["integer", "null"] }
        sw_lat: { type: ["number", "null"] }
        sw_lng: { type: ["number", "null"] }
        ne_lat: { type: ["number", "null"] }
        ne_lng: { type: ["number", "null"] }

    # ── Map layout (2.5D features + walkways) ─────────────────────────────────
    PolygonGeometry:
      type: object
      description: GeoJSON Polygon; coordinates are [lng, lat]
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              items: { type: number }

    LineStringGeometry:
      type: object
      description: GeoJSON LineString; coordinates are [lng, lat]
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [LineString] }
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            items: { type: number }

    MapFeature:
      type: object
      required: [id, name, feature_type, geometry, height_m, min_height_m, is_active]
      properties:
        id: { type: integer }
        name: { type: string }
        feature_type: { type: string }
        geometry: { $ref: "#/components/schemas/PolygonGeometry" }
        height_m: { type: number }
        min_height_m: { type: number }
        wall_color: { type: ["string", "null"] }
        roof_color: { type: ["string", "null"] }
        map_pin_id: { type: ["integer", "null"] }
        is_active: { type: boolean }
        updated_at: { type: ["string", "null"] }

    MapFeatureInput:
      type: object
      required: [name, feature_type, geometry]
      properties:
        name: { type: string, minLength: 1 }
        feature_type: { type: string, enum: [enclosure, building, facility, water, landscape] }
        geometry: { $ref: "#/components/schemas/PolygonGeometry" }
        height_m: { type: number, minimum: 0, maximum: 100 }
        min_height_m: { type: number, minimum: 0, maximum: 100 }
        wall_color: { type: ["string", "null"] }
        roof_color: { type: ["string", "null"] }
        map_pin_id: { type: ["integer", "null"] }

    MapFeatureUpdate:
      type: object
      properties:
        name: { type: ["string", "null"] }
        feature_type: { type: ["string", "null"], enum: [enclosure, building, facility, water, landscape, null] }
        geometry: { $ref: "#/components/schemas/PolygonGeometry" }
        height_m: { type: ["number", "null"], minimum: 0, maximum: 100 }
        min_height_m: { type: ["number", "null"], minimum: 0, maximum: 100 }
        wall_color: { type: ["string", "null"] }
        roof_color: { type: ["string", "null"] }
        map_pin_id: { type: ["integer", "null"] }
        is_active: { type: ["boolean", "null"] }

    MapPath:
      type: object
      required: [id, geometry, is_open, is_accessible]
      properties:
        id: { type: integer }
        name: { type: ["string", "null"] }
        geometry: { $ref: "#/components/schemas/LineStringGeometry" }
        is_open: { type: boolean }
        is_accessible: { type: boolean }
        is_active: { type: boolean, description: "Published: unpublished walkways are shown to staff only and never routed along" }
        kind: { type: string, enum: [walkway, bridge] }
        updated_at: { type: ["string", "null"] }

    MapPathInput:
      type: object
      required: [geometry]
      properties:
        name: { type: ["string", "null"] }
        geometry: { $ref: "#/components/schemas/LineStringGeometry" }
        is_accessible: { type: boolean }
        is_active: { type: boolean }
        kind: { type: string, enum: [walkway, bridge] }

    MapPathUpdate:
      type: object
      properties:
        name: { type: ["string", "null"] }
        geometry: { $ref: "#/components/schemas/LineStringGeometry" }
        is_open: { type: ["boolean", "null"] }
        is_accessible: { type: ["boolean", "null"] }
        is_active: { type: ["boolean", "null"] }
        kind: { type: ["string", "null"], enum: [walkway, bridge, null] }

    MapLayout:
      type: object
      required: [version, features, paths]
      properties:
        version: { type: integer }
        features:
          type: array
          items: { $ref: "#/components/schemas/MapFeature" }
        paths:
          type: array
          items: { $ref: "#/components/schemas/MapPath" }

    MapRoute:
      type: object
      required: [from_pin_id, from_name, to_pin_id, to_name, distance_m, walk_minutes, accessible_only, on_paths, steps, coordinates]
      properties:
        from_pin_id: { type: integer }
        from_name: { type: string }
        to_pin_id: { type: integer }
        to_name: { type: string }
        distance_m: { type: integer }
        walk_minutes: { type: integer }
        accessible_only: { type: boolean }
        on_paths: { type: boolean, description: "false when no walkway connects the places and only a straight-line hint is given" }
        steps:
          type: array
          items: { type: string }
        coordinates:
          type: array
          description: "[lat, lng] points from start to destination"
          items:
            type: array
            items: { type: number }

    MapLayoutVersion:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        updated_at: { type: ["string", "null"] }

    # ── QR Code ───────────────────────────────────────────────────────────────
    QrCode:
      type: object
      required: [id, code, animal_id, qr_image_url, created_at]
      properties:
        id: { type: integer }
        code: { type: string }
        animal_id: { type: integer }
        animal_name: { type: ["string", "null"] }
        qr_image_url: { type: string }
        scan_count: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string }

    QrCodeInput:
      type: object
      required: [animal_id]
      properties:
        animal_id: { type: integer }

    QrScanResult:
      type: object
      required: [animal, qr_code]
      properties:
        animal:
          $ref: "#/components/schemas/Animal"
        qr_code:
          $ref: "#/components/schemas/QrCode"
        nearby_animals:
          type: array
          items:
            $ref: "#/components/schemas/Animal"

    # ── Chat ──────────────────────────────────────────────────────────────────
    ChatMessageInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
        session_id: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        context_animal_id: { type: ["integer", "null"] }

    ChatResponse:
      type: object
      required: [reply, session_id]
      properties:
        reply: { type: string }
        session_id: { type: string }
        intent: { type: ["string", "null"] }
        confidence: { type: ["number", "null"] }
        related_animals:
          type: array
          items:
            $ref: "#/components/schemas/Animal"
        related_locations:
          type: array
          items:
            $ref: "#/components/schemas/MapPin"
        language_detected: { type: ["string", "null"] }
        route: { $ref: "#/components/schemas/MapRoute" }

    ChatHistory:
      type: object
      required: [id, session_id, role, message, created_at]
      properties:
        id: { type: integer }
        session_id: { type: string }
        role: { type: string }
        message: { type: string }
        intent: { type: ["string", "null"] }
        confidence: { type: ["number", "null"] }
        created_at: { type: string }

    ChatFeedbackInput:
      type: object
      required: [chat_history_id, rating]
      properties:
