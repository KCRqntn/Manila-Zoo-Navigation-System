        rating: { type: integer }
        comment: { type: ["string", "null"] }

    ChatFeedback:
      type: object
      required: [id, chat_history_id, rating, created_at]
      properties:
        id: { type: integer }
        chat_history_id: { type: integer }
        rating: { type: integer }
        comment: { type: ["string", "null"] }
        created_at: { type: string }

    # ── FAQ ────────────────────────────────────────────────────────────────────
    Faq:
      type: object
      required: [id, question, answer, language, created_at]
      properties:
        id: { type: integer }
        question: { type: string }
        answer: { type: string }
        category: { type: ["string", "null"] }
        language: { type: string }
        is_active: { type: boolean }
        created_at: { type: string }

    FaqInput:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, minLength: 1 }
        answer: { type: string, minLength: 1 }
        category: { type: ["string", "null"] }
        language: { type: string }

    FaqUpdate:
      type: object
      properties:
        question: { type: ["string", "null"] }
        answer: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        is_active: { type: ["boolean", "null"] }

    # ── Favorites ─────────────────────────────────────────────────────────────
    Favorite:
      type: object
      required: [id, animal_id, user_id, created_at]
      properties:
        id: { type: integer }
        animal_id: { type: integer }
        user_id: { type: string }
        animal:
          $ref: "#/components/schemas/Animal"
        created_at: { type: string }

    FavoriteInput:
      type: object
      required: [animal_id]
      properties:
        animal_id: { type: integer }

    # ── Analytics ─────────────────────────────────────────────────────────────
    AnalyticsEventInput:
      type: object
      required: [event_type]
      properties:
        event_type: { type: string }
        animal_id: { type: ["integer", "null"] }
        map_pin_id: { type: ["integer", "null"] }
        qr_code_id: { type: ["integer", "null"] }
        metadata: { type: ["string", "null"] }
        session_id: { type: ["string", "null"] }

    AnalyticsEvent:
      type: object
      required: [id, event_type, created_at]
      properties:
        id: { type: integer }
        event_type: { type: string }
        animal_id: { type: ["integer", "null"] }
        map_pin_id: { type: ["integer", "null"] }
        qr_code_id: { type: ["integer", "null"] }
        metadata: { type: ["string", "null"] }
        session_id: { type: ["string", "null"] }
        created_at: { type: string }

    DashboardStats:
      type: object
      required: [total_animals, total_users, total_qr_scans, total_chat_messages, total_visitors_today]
      properties:
        total_animals: { type: integer }
        total_users: { type: integer }
        total_qr_scans: { type: integer }
        total_chat_messages: { type: integer }
        total_visitors_today: { type: integer }
        total_favorites: { type: integer }
        total_map_pins: { type: integer }
        chatbot_accuracy: { type: ["number", "null"] }

    PopularAnimalStat:
      type: object
      required: [animal_id, animal_name, view_count]
      properties:
        animal_id: { type: integer }
        animal_name: { type: string }
        image_url: { type: ["string", "null"] }
        view_count: { type: integer }
        qr_scan_count: { type: integer }

    ChatbotStats:
      type: object
      required: [total_messages, avg_confidence, top_intents]
      properties:
        total_messages: { type: integer }
        avg_confidence: { type: number }
        top_intents:
          type: array
          items:
            $ref: "#/components/schemas/IntentStat"
        messages_today: { type: integer }
        positive_feedback_pct: { type: ["number", "null"] }

    IntentStat:
      type: object
      required: [intent, count]
      properties:
        intent: { type: string }
        count: { type: integer }

    QrScanStat:
      type: object
      required: [animal_id, animal_name, scan_count]
      properties:
        animal_id: { type: integer }
        animal_name: { type: string }
        scan_count: { type: integer }

    # ── User Profile ──────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, email, role, created_at]
      properties:
        id: { type: string }
        email: { type: string }
        full_name: { type: ["string", "null"] }
        avatar_url: { type: ["string", "null"] }
        role: { type: string }
        is_active: { type: boolean }
        created_at: { type: string }
        last_login: { type: ["string", "null"] }

    UserProfileUpdate:
      type: object
      properties:
        full_name: { type: ["string", "null"] }
        avatar_url: { type: ["string", "null"] }
        role: { type: ["string", "null"] }
        is_active: { type: ["boolean", "null"] }

    # ── Announcement ──────────────────────────────────────────────────────────
    Announcement:
      type: object
      required: [id, title, message, is_active, created_at]
      properties:
        id: { type: integer }
        title: { type: string }
        message: { type: string }
        type: { type: ["string", "null"] }
        is_active: { type: boolean }
        expires_at: { type: ["string", "null"] }
        created_at: { type: string }

    AnnouncementInput:
      type: object
      required: [title, message]
      properties:
        title: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        type: { type: ["string", "null"] }
        expires_at: { type: ["string", "null"] }

    AnnouncementUpdate:
      type: object
      properties:
        title: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
        type: { type: ["string", "null"] }
        is_active: { type: ["boolean", "null"] }
        expires_at: { type: ["string", "null"] }

    # ── Event ─────────────────────────────────────────────────────────────────
    ZooEvent:
      type: object
      required: [id, title, start_date, created_at]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        start_date: { type: string }
        end_date: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        image_url: { type: ["string", "null"] }
        is_active: { type: boolean }
        created_at: { type: string }

    ZooEventInput:
      type: object
      required: [title, start_date]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        start_date: { type: string }
        end_date: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        image_url: { type: ["string", "null"] }

    ZooEventUpdate:
      type: object
      properties:
        title: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        start_date: { type: ["string", "null"] }
        end_date: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        image_url: { type: ["string", "null"] }
        is_active: { type: ["boolean", "null"] }

    # ── Training Data ─────────────────────────────────────────────────────────
    TrainingDataItem:
      type: object
      required: [id, intent, question, answer, language, created_at]
      properties:
        id: { type: integer }
        intent: { type: string }
        question: { type: string }
        answer: { type: string }
        language: { type: string }
        is_validated: { type: boolean }
        created_at: { type: string }

    TrainingDataUpdate:
      type: object
      properties:
        intent: { type: ["string", "null"] }
        is_validated: { type: ["boolean", "null"] }

    ModelStatus:
      type: object
      required: [service_online, model_available, intents, approved_examples, pending_examples]
      properties:
        service_online: { type: boolean, description: "Whether the BERT service (ai-training/predict_api.py) answered" }
        model_available: { type: boolean }
        base_model: { type: ["string", "null"] }
        trained_at: { type: ["string", "null"] }
        train_size: { type: ["integer", "null"] }
        admin_examples_used: { type: ["integer", "null"] }
        test_size: { type: ["integer", "null"] }
        accuracy: { type: ["number", "null"] }
        macro_f1: { type: ["number", "null"] }
        keyword_accuracy: { type: ["number", "null"] }
        intents:
          type: array
          items: { type: string }
        approved_examples: { type: integer, description: "Admin examples approved for the next retraining" }
        pending_examples: { type: integer, description: "Admin examples waiting for review" }

    TrainingDataInput:
      type: object
      required: [intent, question, answer]
      properties:
        intent: { type: string, minLength: 1 }
        question: { type: string, minLength: 1 }
        answer: { type: string, minLength: 1 }
        language: { type: string }
