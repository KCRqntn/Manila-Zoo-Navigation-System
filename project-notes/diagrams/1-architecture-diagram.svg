ght="700" fill="#24302a">Cloudflare Tunnel (HTTPS)</text><text x="364" y="390" font-size="14" font-family='"JetBrains Mono", Consolas, monospace' fill="#5b6660">manilazoonavigationsystem.com</text><text x="364" y="414" font-size="16.5"  fill="#24302a">Public address; forwards to the laptop</text><rect x="1010" y="330" width="470" height="130" rx="12" fill="#ffffff" stroke="#c9d1cc" stroke-width="2"/><text x="1034" y="360" font-size="20" font-weight="700" fill="#24302a">On the laptop</text><text x="1034" y="390" font-size="14" font-family='"JetBrains Mono", Consolas, monospace' fill="#5b6660">http://localhost:4173</text><text x="1034" y="414" font-size="16.5"  fill="#24302a">Direct local access</text><rect x="1520" y="330" width="410" height="130" rx="12" fill="#efe5f3" stroke="#7d4f91" stroke-width="2"/><text x="1544" y="360" font-size="20" font-weight="700" fill="#24302a">OpenStreetMap</text><text x="1544" y="390" font-size="16.5"  fill="#24302a">Map tiles under the zoo map</text><text x="1544" y="416" font-size="16.5"  fill="#24302a">(external)</text><path d="M680 264 L680 328" fill="none" stroke="#4c5752" stroke-width="2"  marker-end="url(#ar)"/><path d="M1300 264 L925 328" fill="none" stroke="#4c5752" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ar)"/><path d="M1420 264 L1250 328" fill="none" stroke="#4c5752" stroke-width="2"  marker-end="url(#ar)"/><rect x="312" y="530" width="1580" height="270" rx="12" fill="#e6efe7" stroke="#2f5e40" stroke-width="2.5"/><text x="336" y="564" font-size="24" font-weight="700" fill="#1f4a33">React + TypeScript web app<tspan dx="18" font-family='"JetBrains Mono", Consolas, monospace' font-size="14" font-weight="400" fill="#5b6660">Vite · Tailwind · shadcn/ui · port 4173 · /api proxied to 5000</tspan></text><rect x="342" y="590" width="760" height="190" rx="12" fill="#e6efe7" stroke="#2f5e40" stroke-width="2"/><text x="366" y="620" font-size="20" font-weight="700" fill="#24302a">Visitor website</text><text x="366" y="652" font-size="16.5"  fill="#24302a">Registration (QR) · 2D / 3D zoo map: walkways, bridges, facilities, trees</text><text x="366" y="678" font-size="16.5"  fill="#24302a">Directions · nearest restroom, food, first aid, exit · GPS / QR location</text><text x="366" y="704" font-size="16.5"  fill="#24302a">Animal guide · QR scanner · AI Guide chatbot (also works offline)</text><text x="366" y="730" font-size="16.5"  fill="#24302a">Events, announcements · scavenger hunts · points, rewards, favourites</text><text x="366" y="756" font-size="14" font-family='"JetBrains Mono", Consolas, monospace' fill="#5b6660">Leaflet · MapLibre · html5-qrcode · offline cache · live map updates</text><rect x="1124" y="590" width="740" height="190" rx="12" fill="#e6efe7" stroke="#2f5e40" stroke-width="2"/><text x="1148" y="620" font-size="20" font-weight="700" fill="#24302a">Admin dashboard</text><text x="1148" y="652" font-size="16.5"  fill="#24302a">Map Management: add, edit, move, rotate, publish places,</text><text x="1148" y="678" font-size="16.5"  fill="#24302a">outlines, walkways, bridges and facilities · park areas, trees</text><text x="1148" y="704" font-size="16.5"  fill="#24302a">Animals, photos · QR codes · games, rewards · events, prices, FAQs</text><text x="1148" y="730" font-size="16.5"  fill="#24302a">Chatbot data · visitor statistics · audit log · backups · accounts</text><text x="1148" y="756" font-size="14" font-family='"JetBrains Mono", Consolas, monospace' fill="#5b6660">Role-based access: Director · Admin · Editor · Viewer</text><text x="366" y="788" font-family='"JetBrains Mono", Consolas, monospace' font-size="13" fill="#5b6660"></text><path d="M655 460 L655 528" fill="none" stroke="#4c5752" stroke-width="2"  marker-end="url(#ar)"/><path d="M1245 460 L1245 528" fill="none" stroke="#4c5752" stroke-width="2"  marker-end="url(#ar)"/><path d="M1705 530 L1705 462" fill="none" stroke="#4c5752" stroke-width="2"  marker-end="url(#ar)"/><rect x="1716" y="487" width="94.8" height="22" fill="#ffffff"/><text x="1722" y="502" font-family='"JetBrains Mono", Consolas, monospace' font-size="15" text-anchor="start" fill="#24302a">map tiles</text><rect x="312" y="860" width="1580" height="300" rx="12" fill="#e6efe7" stroke="#2f5e40" stroke-width="2.5"/><text x="336" y="894" font-size="24" font-weight="700" fill="#1f4a33">Express 5 API server<tspan dx="18" font-family='"JetBrains Mono", Consolas, monospace' font-size="14" font-weight="400" fill="#5b6660">Node.js 22 · TypeScript · Drizzle ORM · port 5000</tspan></text><rect x="342" y="912" width="1520" height="50" rx="8" fill="#ffffff" stroke="#c9d1cc" stroke-width="1.5"/>
<text x="366" y="943" font-size="16" fill="#24302a">Every request: sign-in check (Supabase token + role) · Zod validation · audit log of admin changes · map version bumped on every map change</text><rect x="342" y="984" width="290" height="150" rx="10" fill="#e6efe7" stroke="#2f5e40" stroke-width="2"/><text x="366" y="1018" font-size="19" font-weight="700" fill="#24302a">Content</text><text x="366" y="1048" font-size="16.5"  fill="#24302a">animals, categories, events,</text><text x="366" y="1074" font-size="16.5"  fill="#24302a">announcements, FAQ, prices</text><rect x="650" y="984" width="290" height="150" rx="10" fill="#e6efe7" stroke="#2f5e40" stroke-width="2"/><text x="674" y="1018" font-size="19" font-weight="700" fill="#24302a">Map &amp; QR</text><text x="674" y="1048" font-size="16.5"  fill="#24302a">pins, outlines, walkways, bridges,</text><text x="674" y="1074" font-size="16.5"  fill="#24302a">facilities, trees · walking routes</text><rect x="958" y="984" width="290" height="150" rx="10" fill="#e3ecf7" stroke="#3f6aa3" stroke-width="2"/><text x="982" y="1018" font-size="19" font-weight="700" fill="#24302a">Chatbot</text><text x="982" y="1048" font-size="16.5"  fill="#24302a">spelling fix → intent →</text><text x="982" y="1074" font-size="16.5"  fill="#24302a">answer from the database</text><rect x="1266" y="984" width="290" height="150" rx="10" fill="#e6efe7" stroke="#2f5e40" stroke-width="2"/><text x="1290" y="1018" font-size="19" font-weight="700" fill="#24302a">Visitors</text><text x="1290" y="1048" font-size="16.5"  fill="#24302a">registrations, accounts, games,</text><text x="1290" y="1074" font-size="16.5"  fill="#24302a">points, rewards, feedback</text><rect x="1574" y="984" width="290" height="150" rx="10" fill="#e6efe7" stroke="#2f5e40" stroke-width="2"/><text x="1598" y="1018" font-size="19" font-weight="700" fill="#24302a">Administration</text><text x="1598" y="1048" font-size="16.5"  fill="#24302a">admin accounts, settings, analytics,</text><text x="1598" y="1074" font-size="16.5"  fill="#24302a">uploads, backups, audit, versions</text><path d="M985 800 L985 858" fill="none" stroke="#4c5752" stroke-width="2"  marker-end="url(#ar)"/><rect x="998" y="823" width="196" height="22" fill="#ffffff"/><text x="1004" y="838" font-family='"JetBrains Mono", Consolas, monospace' font-size="15" text-anchor="start" fill="#24302a">/api requests (JSON)</text><rect x="312" y="1230" width="660" height="270" rx="12" fill="#e6efe7" stroke="#2f5e40" stroke-width="2"/><text x="336" y="1260" font-size="20" font-weight="700" fill="#24302a">PostgreSQL database</text><text x="336" y="1286" font-size="14" font-family='"JetBrains Mono", Consolas, monospace' fill="#5b6660">on the laptop · 40 tables · migrations run at startup</text><text x="336" y="1318" font-size="16.5"  fill="#24302a">Zoo content: animals, gallery, events, announcements, FAQ,</text><text x="336" y="1344" font-size="16.5"  fill="#24302a">ticket prices · Map: pins, outlines, walkways, facilities,</text><text x="336" y="1370" font-size="16.5"  fill="#24302a">park areas, trees, versions, QR codes · Visitors: profiles,</text><text x="336" y="1396" font-size="16.5"  fill="#24302a">registrations, games, points, rewards · Records: chat history,</text><text x="336" y="1422" font-size="16.5"  fill="#24302a">feedback, analytics, audit logs, backups</text><rect x="1000" y="1230" width="455" height="270" rx="12" fill="#e3ecf7" stroke="#3f6aa3" stroke-width="2"/><text x="1024" y="1260" font-size="20" font-weight="700" fill="#24302a">AI intent service</text><text x="1024" y="1286" font-size="14" font-family='"JetBrains Mono", Consolas, monospace' fill="#5b6660">Python · FastAPI · port 8000</text><text x="1024" y="1318" font-size="16.5"  fill="#24302a">Fine-tuned multilingual BERT</text><text x="1024" y="1344" font-size="16.5"  fill="#24302a">(bert-base-multilingual-cased)</text><text x="1024" y="1370" font-size="16.5"  fill="#24302a">Sorts each question into 1 of 12</text><text x="1024" y="1396" font-size="16.5"  fill="#24302a">intents · English, Filipino, Taglish</text><text x="1024" y="1422" font-size="14" font-family='"JetBrains Mono", Consolas, monospace' fill="#5b6660">92.8% accuracy · macro F1 0.92 (138 tests)</text><rect x="1485" y="1230" width="407" height="270" rx="12" fill="#efe5f3" stroke="#7d4f91" stroke-width="2"/><text x="1509" y="1264" font-size="20" font-weight="700" fill="#24302a">Supabase (cloud)</text><rect x="1510" y="1285" width="357" height="86" rx="10" fill="#ffffff" stroke="#c9d1cc" stroke-width="2"/><text x="1534" y="1319" font-size="18" font-weight="700" fill="#24302a">Auth</text><text x="1534" y="1347" font-size="16.5"  fill="#24302a">accounts, logins, roles</text><rect x="1510" y="1390" width="357" height="86" rx="10" fill="#ffffff" stroke="#c9d1cc" stroke-width="2"/><text x="1534" y="1424" font-size="18" font-weight="700" fill="#24302a">Storage</text><text x="1534" y="1452" font-size="16.5"  fill="#24302a">animal and facility photos</text><path d="M640 1134 L640 1228" fill="none" stroke="#4c5752" stroke-width="2"  marker-end="url(#ar)"/><rect x="654" y="1170" width="131.6" height="22" fill="#ffffff"/><text x="660" y="1185" font-family='"JetBrains Mono", Consolas, monospace' font-size="15" text-anchor="start" fill="#24302a">SQL (Drizzle)</text><path d="M1101 1134 L1101 1228" fill="none" stroke="#4c5752" stroke-width="2"  marker-end="url(#ar)"/><rect x="1114" y="1170" width="131.6" height="22" fill="#ffffff"/><text x="1120" y="1185" font-family='"JetBrains Mono", Consolas, monospace' font-size="15" text-anchor="start" fill="#24302a">POST /predict</text><path d="M1718 1134 L1718 1228" fill="none" stroke="#4c5752" stroke-width="2"  marker-end="url(#ar)"/><rect x="1602" y="1170" width="196" height="22" fill="#ffffff"/><text x="1700" y="1185" font-family='"JetBrains Mono", Consolas, monospace' font-size="15" text-anchor="end" fill="#24302a">verify token, upload</text><path d="M1892 685 L1925 685 L1925 1328 L1869 1328" f