  <text x="830" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#4f7d5b">Manila Zoo Navigation and Information System</text><line x1="176" y1="582" x2="430" y2="190" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="582" x2="430" y2="270" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="582" x2="430" y2="350" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="582" x2="430" y2="430" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="582" x2="430" y2="510" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="582" x2="430" y2="590" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="582" x2="430" y2="670" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="582" x2="430" y2="750" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="582" x2="430" y2="830" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="582" x2="430" y2="910" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="582" x2="430" y2="990" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="1170" x2="430" y2="1118" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="1170" x2="430" y2="1198" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="1170" x2="430" y2="1278" stroke="#3c4a40" stroke-width="1.5"/><line x1="1374" y1="714" x2="790" y2="670" stroke="#3c4a40" stroke-width="1.5"/><path d="M763.9 444.0 L916.1 457.8" fill="none" stroke="#6b7a70" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#open)"/>
