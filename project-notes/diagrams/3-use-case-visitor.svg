  <text x="834.5086210875928" y="1241.1802507113466" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5d6b61">«include»</text><ellipse cx="610" cy="190" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="195" text-anchor="middle" font-size="14.5" fill="#1f2b23">View the zoo map (2D / 3D)</text><ellipse cx="610" cy="270" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="275" text-anchor="middle" font-size="14.5" fill="#1f2b23">Search places and animals</text><ellipse cx="610" cy="350" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="355" text-anchor="middle" font-size="14.5" fill="#1f2b23">Get walking directions</text><ellipse cx="610" cy="430" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="426.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">Find the nearest restroom,</text><text x="610" y="443.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">food, first aid or exit</text><ellipse cx="610" cy="510" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="515" text-anchor="middle" font-size="14.5" fill="#1f2b23">Scan a QR code</text><ellipse cx="610" cy="590" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="595" text-anchor="middle" font-size="14.5" fill="#1f2b23">View an animal's profile</text><ellipse cx="610" cy="670" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="666.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">Ask the AI Guide</text><text x="610" y="683.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">(English / Filipino)</text><ellipse cx="610" cy="750" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="755" text-anchor="middle" font-size="14.5" fill="#1f2b23">Save the zoo for offline use</text><ellipse cx="610" cy="830" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="826.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">View events, announcements,</text><text x="610" y="843.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">hours and ticket prices</text><ellipse cx="610" cy="910" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="906.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">Rate an animal or a</text><text x="610" y="923.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">chatbot answer</text><ellipse cx="610" cy="990" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="986.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">Create an account and</text><text x="610" y="1003.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">register a visit</text><ellipse cx="610" cy="1118" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="1114.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">Play a scavenger hunt</text><text x="610" y="1131.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">and earn points</text><ellipse cx="610" cy="1198" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="1203" text-anchor="middle" font-size="14.5" fill="#1f2b23">Redeem points for rewards</text><ellipse cx="610" cy="1278" rx="180" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="610" y="1283" text-anchor="middle" font-size="14.5" fill="#1f2b23">Save favourite animals</text><ellipse cx="1050" cy="470" rx="150" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="1050" y="466.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">Set my location</text><text x="1050" y="483.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">(GPS or tap the map)</text><ellipse cx="1050" cy="742" rx="150" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="1050" y="738.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">Answer offline</text><text x="1050" y="755.5" text-anchor="middle" font-size="14.5" fill="#1f2b23">(no signal)</text><ellipse cx="1050" cy="1198" rx="150" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="1050" y="1203" text-anchor="middle" font-size="14.5" fill="#1f2b23">Sign in</text><line x1="150" y1="1124" x2="150" y2="682" stroke="#3c4a40" stroke-width="1.6" marker-end="url(#tri)"/><g>
