  <g><path d="M990 1178.4 h270 v68 h-270 z" fill="#fffbe8" stroke="#c9b45a"/><path d="M1246 1178.4 v14 h14" fill="none" stroke="#c9b45a"/>
    <text x="1004" y="1202.4" font-size="13" fill="#1f2b23">Every role signs in first; the role</text>
    <text x="1004" y="1220.4" font-size="13" fill="#1f2b23">decides which use cases it can do.</text>
    <text x="1004" y="1238.4" font-size="13" fill="#1f2b23">Every change goes to the audit log.</text></g><ellipse cx="660" cy="190" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="195" text-anchor="middle" font-size="14.5" fill="#1f2b23">Manage administrator accounts</text><ellipse cx="660" cy="290.8" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="295.8" text-anchor="middle" font-size="14.5" fill="#1f2b23">Manage user roles</text><ellipse cx="660" cy="362.79999999999995" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="367.79999999999995" text-anchor="middle" font-size="14.5" fill="#1f2b23">View and export audit logs</text><ellipse cx="660" cy="434.79999999999995" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="439.79999999999995" text-anchor="middle" font-size="14.5" fill="#1f2b23">Back up and restore data</text><ellipse cx="660" cy="506.8" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="511.8" text-anchor="middle" font-size="14.5" fill="#1f2b23">Change system settings</text><ellipse cx="660" cy="607.5999999999999" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="604.0999999999999" text-anchor="middle" font-size="14.5" fill="#1f2b23">Manage the map: places, outlines,</text><text x="660" y="621.0999999999999" text-anchor="middle" font-size="14.5" fill="#1f2b23">walkways, bridges, facilities</text><ellipse cx="660" cy="679.5999999999999" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="684.5999999999999" text-anchor="middle" font-size="14.5" fill="#1f2b23">Manage animals and photo galleries</text><ellipse cx="660" cy="751.6" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="756.6" text-anchor="middle" font-size="14.5" fill="#1f2b23">Manage QR codes and their points</text><ellipse cx="660" cy="823.6" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="828.6" text-anchor="middle" font-size="14.5" fill="#1f2b23">Manage events, announcements, FAQs</text><ellipse cx="660" cy="895.6" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="900.6" text-anchor="middle" font-size="14.5" fill="#1f2b23">Manage games and rewards</text><ellipse cx="660" cy="967.6" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="972.6" text-anchor="middle" font-size="14.5" fill="#1f2b23">Manage park areas and trees</text><ellipse cx="660" cy="1039.6" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="1044.6" text-anchor="middle" font-size="14.5" fill="#1f2b23">Manage chatbot training data</text><ellipse cx="660" cy="1111.6" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="1116.6" text-anchor="middle" font-size="14.5" fill="#1f2b23">Update visitor submissions</text><ellipse cx="660" cy="1212.4" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="1217.4" text-anchor="middle" font-size="14.5" fill="#1f2b23">Sign in (role-based access)</text><ellipse cx="660" cy="1284.3999999999999" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="1289.3999999999999" text-anchor="middle" font-size="14.5" fill="#1f2b23">View the dashboard and analytics</text><ellipse cx="660" cy="1356.3999999999999" rx="220" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="660" y="1361.3999999999999" text-anchor="middle" font-size="14.5" fill="#1f2b23">View submissions and registrations</text><ellipse cx="1150" cy="607.5999999999999" rx="150" ry="27" fill="#ffffff" stroke="#4f7d5b" stroke-width="1.8"/><text x="1150" y="604.0999999999999" text-anchor="middle" font-size="14.5" fill="#1f2b23">Publish or unpublish</text><text x="1150" y="621.0999999999999" text-anchor="middle" font-size="14.5" fill="#1f2b23">a map element</text><line x1="150" y1="278" x2="150" y2="342.8" stroke="#3c4a40" stroke-width="1.6" marker-end="url(#tri)"/><line x1="150" y1="486.8" x2="150" y2="803.5999999999999" stroke="#3c4a40" stroke-width="1.6" marker-end="url(#tri)"/><line x1="150" y1="947.5999999999999" x2="150" y2="1228.4" stroke="#3c4a40" stroke-width="1.6" marker-end="url(#tri)"/><g>
