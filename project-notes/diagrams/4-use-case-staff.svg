<text x="40" y="44" font-size="24" font-weight="700" fill="#2c5a3a">Use case diagram: Zoo staff (admin dashboard)</text>
<text x="40" y="70" font-size="14" fill="#5d6b61">Each role inherits everything the role below it can do: Director → Admin → Editor → Viewer</text><rect x="400" y="100" width="940" height="1326" rx="6" fill="#f4f8f2" stroke="#4f7d5b" stroke-width="2"/>
  <text x="870" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#4f7d5b">Admin dashboard · Manila Zoo Navigation and Information System</text><line x1="176" y1="182" x2="440" y2="190" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="390.8" x2="440" y2="290.8" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="390.8" x2="440" y2="362.79999999999995" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="390.8" x2="440" y2="434.79999999999995" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="390.8" x2="440" y2="506.8" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="851.5999999999999" x2="440" y2="607.5999999999999" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="851.5999999999999" x2="440" y2="679.5999999999999" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="851.5999999999999" x2="440" y2="751.6" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="851.5999999999999" x2="440" y2="823.6" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="851.5999999999999" x2="440" y2="895.6" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="851.5999999999999" x2="440" y2="967.6" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="851.5999999999999" x2="440" y2="1039.6" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="851.5999999999999" x2="440" y2="1111.6" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="1276.4" x2="440" y2="1212.4" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="1276.4" x2="440" y2="1284.3999999999999" stroke="#3c4a40" stroke-width="1.5"/><line x1="176" y1="1276.4" x2="440" y2="1356.3999999999999" stroke="#3c4a40" stroke-width="1.5"/><path d="M1000.0 607.6 L880.0 607.6" fill="none" stroke="#6b7a70" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#open)"/>
